<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>냉각탑용수 절감 - Work Knowledge Base</title>
    <script>
        tailwind = { config: {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        bg: '#090d16',
                        surface: '#0f172a',
                        surface_card: '#131d33',
                        surface_border: '#1e293b',
                        text_main: '#f8fafc',
                        text_muted: '#94a3b8',
                        cooling: '#06b6d4'
                    },
                    fontFamily: {
                        sans: ['Pretendard', '-apple-system', 'sans-serif'],
                    }
                }
            }
        } }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #090d16; color: #f8fafc; font-family: 'Pretendard', sans-serif; line-height: 1.6; }
        .hero-title { background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 50%, #06b6d4 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .glass-card { background: #131d33; border: 1px solid #1e293b; border-radius: 1rem; padding: 2rem; }
        .doc-link { color: #f8fafc; transition: all 0.2s; }
        .doc-link:hover { color: #06b6d4; }
    </style>
</head>
<body class="min-h-screen p-6 md:p-12">

    <header class="max-w-4xl mx-auto mb-12 flex items-center justify-between">
        <div>
            <h1 class="text-3xl font-extrabold hero-title mb-2"><i class="fas fa-tint text-cooling mr-3"></i> 냉각탑용수 절감 (Cooling Tower)</h1>
            <p class="text-text_muted">수자원 절감 기술 검토 및 엔지니어링 분석 자료</p>
        </div>
        <a href="../index.html" class="px-4 py-2 rounded-lg border border-surface_border hover:bg-surface_card text-text_muted hover:text-text_main transition-colors">
            <i class="fas fa-arrow-left mr-2"></i> 대시보드로 돌아가기
        </a>
    </header>

    <main class="max-w-4xl mx-auto space-y-8">
        <div class="glass-card">
            <h2 class="text-xl font-bold border-b border-surface_border pb-4 mb-6"><i class="fas fa-book-open text-cooling mr-2"></i> 세부 리서치 자료</h2>
            
            <ul class="space-y-6">
                <li class="flex items-start bg-surface/50 p-4 rounded-lg border border-surface_border/50 hover:border-cooling/30 transition-colors">
                    <div class="w-10 h-10 rounded-lg bg-cooling/10 flex items-center justify-center text-cooling mr-4 shrink-0">
                        <i class="fas fa-filter"></i>
                    </div>
                    <div>
                        <a href="./docs/01_water_capture.html" class="text-lg font-bold doc-link">증발수 포집 기술 (Evaporated Water Capture) 분석</a>
                        <p class="text-text_muted text-sm mt-2">데미스터, 제습/흡착, 열전소자를 이용한 포집 기술의 원리와 열역학적/경제적 한계점(정압 강하 및 동력 낭비) 검토</p>
                    </div>
                </li>
                <li class="flex items-start bg-surface/50 p-4 rounded-lg border border-surface_border/50 hover:border-cooling/30 transition-colors">
                    <div class="w-10 h-10 rounded-lg bg-cooling/10 flex items-center justify-center text-cooling mr-4 shrink-0">
                        <i class="fas fa-sync-alt"></i>
                    </div>
                    <div>
                        <a href="./docs/02_hybrid_cooling_tower.html" class="text-lg font-bold doc-link">밀폐형 및 하이브리드 냉각탑 분석</a>
                        <p class="text-text_muted text-sm mt-2">수자원 소모를 원천 차단하기 위한 밀폐형/하이브리드 냉각탑 원리 비교, 수자원 절감 효과 및 TCO(총소유비용) 분석</p>
                    </div>
                </li>
            </ul>
        </div>
    </main>

</body>
</html>
