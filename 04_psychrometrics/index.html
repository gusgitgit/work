<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psychrometric Calculator - Knowledge Base</title>
    
    <script>
        tailwind = { config: {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        bg: '#090d16',
                        surface: '#0f172a',
                        surface_card: '#131d33',
                        surface_border: '#1e293b',
                        text_main: '#f8fafc',
                        text_muted: '#94a3b8',
                        primary: '#38bdf8',
                        accent: '#10b981',
                        psy: '#f43f5e'
                    },
                    fontFamily: { sans: ['Pretendard', '-apple-system', 'sans-serif'] }
                }
            }
        } }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/psychrolib@1.1.1/psychrolib.js"></script>

    <style>
        body { background-color: #090d16; color: #f8fafc; font-family: 'Pretendard', sans-serif; line-height: 1.6; }
        .hero-title { background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 50%, #f43f5e 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .glass-card { 
            background: #131d33; border: 1px solid #1e293b; border-radius: 1rem; 
            padding: 1.25rem; box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5); 
        }
        @media (min-width: 640px) { .glass-card { padding: 2.5rem; } }
        
        .prop-card { display: flex; flex-direction: column; gap: 0.35rem; }
        
        .input-field { 
            background: #0f172a; border: 1px solid #1e293b; color: #f8fafc; 
            padding: 1rem 3.5rem 1rem 1rem; border-radius: 0.75rem; outline: none; 
            transition: all 0.2s; font-family: 'JetBrains Mono', monospace; 
            font-size: 1.25rem; font-weight: 800; text-align: right; width: 100%;
        }
        .input-field:focus { border-color: #f43f5e; background: rgba(244, 63, 94, 0.05); box-shadow: 0 0 0 3px rgba(244, 63, 94, 0.1); }
        .input-field:hover:not(:focus) { border-color: #38bdf8; }
        
        .unit-label { font-size: 0.95rem; font-weight: 600; color: #64748b; }

        /* Chrome, Safari, Edge, Opera */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        /* Firefox */
        input[type=number] { -moz-appearance: textfield; }

        .error-state .input-field { color: #ef4444 !important; border-color: rgba(239, 68, 68, 0.5); }
        .err-msg { display: none; color: #ef4444; font-size: 0.85rem; font-weight: 600; margin-top: 0.5rem; text-align: center; }
        .error-state + .err-msg { display: block; }
    </style>
</head>
<body class="min-h-screen p-4 sm:p-6 md:p-12">

    <header class="max-w-4xl mx-auto mb-8 sm:mb-12 text-center">
        <a href="../index.html" class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-blue-900/30 text-primary border border-blue-500/30 text-sm font-semibold mb-6 hover:bg-blue-900/50 transition-colors" style="text-decoration:none;"><i class="fas fa-arrow-left"></i> 중앙 지식베이스</a>
        <br>
        <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-psy/10 text-psy border border-psy/30 text-sm font-semibold mb-4">
            <i class="fa-solid fa-temperature-half"></i> Psychrometrics
        </div>
        <h1 class="text-3xl md:text-5xl font-extrabold hero-title mb-4">Omni-directional Psychrometric Chart</h1>
        <p class="text-text_muted text-base sm:text-lg max-w-2xl mx-auto px-2">건구온도를 기준으로 <strong>어떤 상태량이든 자유롭게 수정</strong>하면 나머지 모든 값이 즉시 연동되어 실시간 계산됩니다.</p>
    </header>

    <main class="max-w-3xl mx-auto">
        <div class="glass-card relative">
            <div id="properties-grid">
                
                <!-- Pressure (Full width) -->
                <div class="prop-card mb-6 pb-6 border-b border-surface_border">
                    <label class="text-sm font-semibold text-text_muted flex items-center gap-2">
                        <i class="fa-solid fa-gauge-high text-sky-400 w-4 text-center"></i> 대기압 (Atmospheric Pressure)
                    </label>
                    <div class="relative w-full md:w-1/2">
                        <input type="number" id="in-press" value="101325" step="100" oninput="calculate('press')" class="input-field text-sky-400" />
                        <span class="absolute right-4 top-1/2 -translate-y-1/2 unit-label font-mono">Pa</span>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-6">
                    
                    <!-- Dry Bulb -->
                    <div class="prop-card">
                        <label class="text-sm font-semibold text-text_muted flex items-center gap-2">
                            <i class="fa-solid fa-temperature-empty text-orange-400 w-4 text-center"></i> 건구온도 (Dry Bulb)
                        </label>
                        <div class="relative">
                            <input type="number" id="in-tdb" value="25.0" step="0.1" oninput="calculate('tdb')" class="input-field text-orange-400" />
                            <span class="absolute right-4 top-1/2 -translate-y-1/2 unit-label font-mono">°C</span>
                        </div>
                    </div>
                    
                    <!-- Relative Humidity -->
                    <div class="prop-card">
                        <label class="text-sm font-semibold text-text_muted flex items-center gap-2">
                            <i class="fa-solid fa-droplet text-rose-400 w-4 text-center"></i> 상대습도 (Rel. Humidity)
                        </label>
                        <div class="relative">
                            <input type="number" id="in-rh" value="50.0" step="0.1" oninput="calculate('rh')" class="input-field text-rose-400" />
                            <span class="absolute right-4 top-1/2 -translate-y-1/2 unit-label font-mono">%</span>
                        </div>
                    </div>

                    <!-- Humidity Ratio -->
                    <div class="prop-card">
                        <label class="text-sm font-semibold text-text_muted flex items-center gap-2">
                            <i class="fa-solid fa-glass-water text-emerald-400 w-4 text-center"></i> 절대습도 (Hum. Ratio)
                        </label>
                        <div class="relative">
                            <input type="number" id="in-hr" value="9.88" step="0.1" oninput="calculate('hr')" class="input-field text-emerald-400" />
                            <span class="absolute right-4 top-1/2 -translate-y-1/2 unit-label font-mono">g/kg</span>
                        </div>
                    </div>

                    <!-- Enthalpy -->
                    <div class="prop-card">
                        <label class="text-sm font-semibold text-text_muted flex items-center gap-2">
                            <i class="fa-solid fa-bolt text-purple-400 w-4 text-center"></i> 엔탈피 (Enthalpy)
                        </label>
                        <div class="relative">
                            <input type="number" id="in-enth" value="50.22" step="0.1" oninput="calculate('enth')" class="input-field text-purple-400" />
                            <span class="absolute right-4 top-1/2 -translate-y-1/2 unit-label font-mono">kJ/kg</span>
                        </div>
                    </div>

                    <!-- Wet Bulb -->
                    <div class="prop-card">
                        <label class="text-sm font-semibold text-text_muted flex items-center gap-2">
                            <i class="fa-solid fa-temperature-arrow-down text-blue-400 w-4 text-center"></i> 습구온도 (Wet Bulb)
                        </label>
                        <div class="relative">
                            <input type="number" id="in-twb" value="17.82" step="0.1" oninput="calculate('twb')" class="input-field text-blue-400" />
                            <span class="absolute right-4 top-1/2 -translate-y-1/2 unit-label font-mono">°C</span>
                        </div>
                    </div>

                    <!-- Dew Point -->
                    <div class="prop-card">
                        <label class="text-sm font-semibold text-text_muted flex items-center gap-2">
                            <i class="fa-solid fa-snowflake text-cyan-400 w-4 text-center"></i> 노점온도 (Dew Point)
                        </label>
                        <div class="relative">
                            <input type="number" id="in-tdp" value="13.82" step="0.1" oninput="calculate('tdp')" class="input-field text-cyan-400" />
                            <span class="absolute right-4 top-1/2 -translate-y-1/2 unit-label font-mono">°C</span>
                        </div>
                    </div>
                    
                    <!-- Specific Volume -->
                    <div class="prop-card">
                        <label class="text-sm font-semibold text-text_muted flex items-center gap-2">
                            <i class="fa-solid fa-cube text-slate-400 w-4 text-center"></i> 비체적 (Spec. Volume)
                        </label>
                        <div class="relative">
                            <input type="number" id="in-vol" value="0.8583" step="0.0001" oninput="calculate('vol')" class="input-field text-slate-400" />
                            <span class="absolute right-4 top-1/2 -translate-y-1/2 unit-label font-mono">m³/kg</span>
                        </div>
                    </div>

                    <!-- Vapor Pressure -->
                    <div class="prop-card">
                        <label class="text-sm font-semibold text-text_muted flex items-center gap-2">
                            <i class="fa-solid fa-cloud text-gray-400 w-4 text-center"></i> 수증기압 (Vapor Press.)
                        </label>
                        <div class="relative">
                            <input type="number" id="in-vp" value="1583" step="10" oninput="calculate('vp')" class="input-field text-gray-400" />
                            <span class="absolute right-4 top-1/2 -translate-y-1/2 unit-label font-mono">Pa</span>
                        </div>
                    </div>

                </div>
            </div>
            <div class="err-msg"><i class="fa-solid fa-triangle-exclamation"></i> 입력값이 유효한 습공기선도 범위를 벗어났습니다.</div>
        </div>
    </main>

    <script>
        if(typeof psychrolib !== 'undefined') {
            psychrolib.SetUnitSystem(psychrolib.SI);
        } else {
            console.error("Psychrolib failed to load from CDN.");
        }

        // Default secondary constraint parameter is RH
        let currentSecondary = 'rh';

        function calculate(source = null) {
            const grid = document.getElementById('properties-grid');
            if(typeof psychrolib === 'undefined') return;

            // If the user modified a property other than Tdb or Pressure, it becomes the new constraint
            if (source && source !== 'tdb' && source !== 'press') {
                currentSecondary = source;
            }

            try {
                const tdbStr = document.getElementById('in-tdb').value;
                const pressStr = document.getElementById('in-press').value;
                
                if(!tdbStr || !pressStr) throw new Error("Empty input");

                const tdb = parseFloat(tdbStr);
                const press = parseFloat(pressStr);
                
                let hr;
                const secStr = document.getElementById(`in-${currentSecondary}`).value;
                if(!secStr) throw new Error("Empty input");
                const val = parseFloat(secStr);

                switch (currentSecondary) {
                    case 'rh':
                        if(val < 0.0 || val > 100.0) throw new Error("Invalid RH");
                        hr = psychrolib.GetHumRatioFromRelHum(tdb, val / 100.0, press);
                        break;
                    case 'hr':
                        if(val < 0.0) throw new Error("Invalid HR");
                        hr = val / 1000.0;
                        break;
                    case 'enth':
                        // hr = (Enthalpy_J - 1006 * tdb) / (2501000 + 1860 * tdb)
                        hr = (val * 1000.0 - 1006.0 * tdb) / (2501000.0 + 1860.0 * tdb);
                        break;
                    case 'twb':
                        hr = psychrolib.GetHumRatioFromTWetBulb(tdb, val, press);
                        break;
                    case 'tdp':
                        hr = psychrolib.GetHumRatioFromTDewPoint(val, press);
                        break;
                    case 'vol':
                        // hr = ((vol * press) / (287.042 * (tdb + 273.15)) - 1) / 1.607858
                        let term = (val * press) / (287.042 * (tdb + 273.15));
                        hr = (term - 1.0) / 1.607858;
                        break;
                    case 'vp':
                        hr = psychrolib.GetHumRatioFromVapPres(val, press);
                        break;
                }

                if (hr < 0 || isNaN(hr)) throw new Error("Invalid State");

                // Calculate all remaining properties
                const res_rh = psychrolib.GetRelHumFromHumRatio(tdb, hr, press) * 100.0;
                const res_hr = hr * 1000.0;
                const res_enth = psychrolib.GetMoistAirEnthalpy(tdb, hr) / 1000.0;
                const res_twb = psychrolib.GetTWetBulbFromHumRatio(tdb, hr, press);
                const res_tdp = psychrolib.GetTDewPointFromHumRatio(tdb, hr, press);
                const res_vol = psychrolib.GetMoistAirVolume(tdb, hr, press);
                const res_vp = psychrolib.GetVapPresFromHumRatio(hr, press);
                
                if (res_rh > 100.001) throw new Error("Supersaturated");

                // Helper to update fields without interfering with user's typing
                const update = (id, computedValue, decimals) => {
                    // Do not overwrite the field currently being typed into (source)
                    // If source is null (on initial load), update everything
                    if (source !== id) {
                        document.getElementById(`in-${id}`).value = computedValue.toFixed(decimals);
                    }
                };

                // Remove error state
                grid.classList.remove('error-state');

                // Update fields
                update('rh', res_rh, 2);
                update('hr', res_hr, 2);
                update('enth', res_enth, 2);
                update('twb', res_twb, 2);
                update('tdp', res_tdp, 2);
                update('vol', res_vol, 4);
                update('vp', res_vp, 0);

            } catch(e) {
                // Show error state (turns text red and displays error message)
                grid.classList.add('error-state');
            }
        }

        // Initialize calculations on first load
        window.onload = function() {
            calculate();
        };
    </script>
</body>
</html>
